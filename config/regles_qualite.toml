# Règles de qualité exécutées par scripts/quality.py après la construction staging.
#
#   id          identifiant stable (préfixe = domaine)
#   table       table contrôlée
#   regle       ce qui est vérifié, en français
#   severite    bloquant : le pipeline s'arrête si la règle échoue
#               alerte   : signalé dans le rapport d'exécution, le pipeline continue
#   seuil_pct   part de lignes en violation tolérée (0 par défaut)
#   sql         requête renvoyant deux colonnes : nb_violations, nb_lignes_controlees
#
# Chaque exécution est historisée dans la table controles_qualite.

# ---------- Complétude et unicité ----------

[[regle]]
id = "VEN_01"
table = "staging_ventes"
regle = "Clé vente_id unique"
severite = "bloquant"
sql = "SELECT count(*) - count(DISTINCT vente_id), count(*) FROM staging_ventes"

[[regle]]
id = "VEN_02"
table = "staging_ventes"
regle = "Champs obligatoires renseignés (date, client, produit, quantité, montant)"
severite = "bloquant"
sql = """
SELECT count(*) FILTER (WHERE date_vente IS NULL OR client_id IS NULL OR produit_id IS NULL
                           OR quantite IS NULL OR montant_ttc IS NULL),
       count(*)
FROM staging_ventes
"""

[[regle]]
id = "VEN_03"
table = "staging_ventes"
regle = "Plages de valeurs : quantité 1 à 100, montant positif, remise 0 à 50 %"
severite = "bloquant"
sql = """
SELECT count(*) FILTER (WHERE quantite NOT BETWEEN 1 AND 100 OR montant_ttc < 0
                           OR remise_pct NOT BETWEEN 0 AND 0.5),
       count(*)
FROM staging_ventes
"""

[[regle]]
id = "VEN_04"
table = "staging_ventes"
regle = "Dates de vente entre 2020-01-01 et la date de chargement"
severite = "bloquant"
sql = """
SELECT count(*) FILTER (WHERE date_vente < DATE '2020-01-01' OR date_vente > current_date),
       count(*)
FROM staging_ventes
"""

[[regle]]
id = "VEN_05"
table = "staging_ventes"
regle = "Intégrité référentielle : client et produit connus"
severite = "bloquant"
sql = """
SELECT (SELECT count(*) FROM staging_ventes ANTI JOIN staging_clients USING (client_id))
     + (SELECT count(*) FROM staging_ventes ANTI JOIN staging_produits USING (produit_id)),
       (SELECT count(*) FROM staging_ventes)
"""

[[regle]]
id = "VEN_06"
table = "staging_ventes"
regle = "Conservation : lignes brutes dédoublonnées = staging + rejets"
severite = "bloquant"
sql = """
SELECT abs((SELECT count(*) FROM (SELECT DISTINCT * EXCLUDE (_source_file, _run_id, _loaded_at)
                                  FROM raw_ventes))
           - (SELECT count(*) FROM staging_ventes)
           - (SELECT count(*) FROM rejets WHERE table_source = 'raw_ventes')),
       (SELECT count(*) FROM raw_ventes)
"""

[[regle]]
id = "VEN_07"
table = "rejets"
regle = "Taux de rejet des ventes inférieur à 3 %"
severite = "alerte"
seuil_pct = 3
sql = """
SELECT (SELECT count(*) FROM rejets WHERE table_source = 'raw_ventes'),
       (SELECT count(*) FROM raw_ventes)
"""

[[regle]]
id = "VEN_08"
table = "staging_ventes"
regle = "Fraîcheur : dernière vente de moins de 45 jours"
severite = "alerte"
sql = """
SELECT CASE WHEN max(date_vente) < current_date - INTERVAL 45 DAY THEN 1 ELSE 0 END, 1
FROM staging_ventes
"""

[[regle]]
id = "VEN_09"
table = "staging_ventes"
regle = "Volume : dernier mois complet au moins à 60 % de la moyenne des 12 mois précédents"
severite = "alerte"
sql = """
WITH m AS (
    SELECT date_trunc('month', date_vente) AS mois, count(*) AS n
    FROM staging_ventes GROUP BY 1
),
dernier AS (SELECT max(mois) AS mois FROM m)
SELECT CASE WHEN (SELECT n FROM m, dernier WHERE m.mois = dernier.mois)
                 < 0.6 * (SELECT avg(n) FROM m, dernier
                          WHERE m.mois < dernier.mois
                            AND m.mois >= dernier.mois - INTERVAL 12 MONTH)
            THEN 1 ELSE 0 END,
       1
"""

