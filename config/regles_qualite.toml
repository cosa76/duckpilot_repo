[[regle]]
id = "CLI_02"
table = "staging_clients"
regle = "Aucune colonne de données personnelles en clair"
severite = "bloquant"
sql = """
SELECT count(*), 1 FROM information_schema.columns
WHERE table_name = 'staging_clients'
  AND column_name IN ('prenom', 'nom', 'email', 'telephone')
"""

