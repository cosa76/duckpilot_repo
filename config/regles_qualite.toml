sql = "SELECT count(*) - count(DISTINCT ticket_id), count(*) FROM staging_tickets"

[[regle]]
id = "TIC_02"
table = "staging_tickets"
regle = "Aucun email ni téléphone dans les descriptions"
severite = "bloquant"
sql = """
SELECT count(*) FILTER (WHERE regexp_matches(description,
           '[^@\\s]+@[^@\\s]+\\.[a-z]+|0\\d([ .]?\\d{2}){4}')),
       count(*)
FROM staging_tickets
"""

[[regle]]
id = "TIC_03"
table = "staging_tickets"
regle = "Délai de résolution positif et satisfaction entre 1 et 5"
severite = "bloquant"
sql = """
SELECT count(*) FILTER (WHERE delai_resolution_h < 0 OR satisfaction NOT BETWEEN 1 AND 5),
       count(*)
FROM staging_tickets
"""

